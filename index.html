<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#8A9A5B" />
    <meta name="description" content="AniDrop - Live Anime & Manga Tracker" />
    
    <!-- FORCED FAVICON UPDATES -->
    <link rel="shortcut icon" type="image/png" href="./icon-192.png?v=3" />
    <link rel="icon" type="image/png" href="./icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="./icon-192.png?v=3" />
    <link rel="manifest" href="manifest.json" />
    
    <title>AniDrop</title>

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 10px; }
    </style>

    <!-- Import Map for NPM Packages -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "dompurify": "https://esm.sh/dompurify@3.0.9",
          "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
      }
    </script>

    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Load your App -->
    <script type="text/babel" data-type="module" src="App.jsx"></script>

    <!-- Register PWA Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
  </body>
</html>
